<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDA Mission 2027</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">PDA 🚲</div>
    <div class="mission">MISSION 2027</div>
  </header>

  <main>

    <section class="hero">

      <div class="glow red"></div>
      <div class="glow green"></div>

      <div class="hero-content">

        <div class="label">PDA • MISSION 2027</div>

        <h1>
          समाजवादी पार्टी
          <span>🚲 2027</span>
        </h1>

        <p class="subtitle">
          अपनी playlist • अपना music • अपना page
        </p>

        <div class="cycle">
          🚲
        </div>

        <div class="info-box">
          <p id="workText">
            1090 महिला शक्ति लाइन — महिलाओं की सुरक्षा से जुड़ी हेल्पलाइन
          </p>
        </div>

      </div>

    </section>


    <section class="music-section">

      <div class="section-title">
        <div>
          <span>🎵</span>
          <h2>Mission 2027 Playlist</h2>
          <p>YouTube Playlist</p>
        </div>

        <div class="play-icon">▶</div>
      </div>

      <div class="youtube-box">

        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLlBTRvaC0XtKnzRLR5m7dc1S58gk_nZJ_"
          title="PDA Mission 2027 Playlist"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>

      </div>

    </section>

  </main>


  <footer>
    PDA • Mission 2027
  </footer>


  <script>

    const works = [
      "1090 महिला शक्ति लाइन — महिलाओं की सुरक्षा से जुड़ी हेल्पलाइन",
      "लखनऊ मेट्रो — शहरी परिवहन परियोजना",
      "आगरा-लखनऊ एक्सप्रेसवे — 302 किलोमीटर का एक्सप्रेसवे",
      "किसान बाज़ार — किसानों से जुड़ी बाजार व्यवस्था",
      "लोहिया आवास योजना — ग्रामीण आवास से जुड़ी योजना",
      "108 आपातकालीन एम्बुलेंस सेवा — स्वास्थ्य सेवा"
    ];

    let index = 0;

    setInterval(function () {

      index = (index + 1) % works.length;

      const text = document.getElementById("workText");

      text.style.opacity = "0";

      setTimeout(function () {
        text.textContent = works[index];
        text.style.opacity = "1";
      }, 400);

    }, 3500);

  </script>

</body>
</html>
