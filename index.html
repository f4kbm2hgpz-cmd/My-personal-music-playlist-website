<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samajwadi Party 2027</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="phone">

    <div class="topbar">
      <span>MISSION 2027</span>
      <span class="dot"></span>
      <span>PDA 🚲</span>
    </div>

    <section class="hero">
      <div class="flag-glow"></div>

      <div class="hero-content">
        <div class="small-title">MUSIC PLAYLIST</div>
        <h1>MISSION 2027<br><span>(PDA 🚲)</span></h1>
        <p>Apni playlist • Apna music • Apna page</p>
      </div>
    </section>

    <section class="player-card">

      <div class="cover">
        <div class="bicycle">🚲</div>
      </div>

      <div class="track">
        <h2>Samajwadi Party 2027</h2>
        <p>YouTube Playlist</p>
      </div>

      <div class="controls">
        <button aria-label="Previous">⏮</button>

        <button class="play" id="playBtn" aria-label="Play">
          ▶
        </button>

        <button aria-label="Next">⏭</button>
      </div>

      <div class="progress">
        <span></span>
      </div>

      <div class="time">
        <span>00:00</span>
        <span>Playlist</span>
      </div>

    </section>

    <section class="playlist">

      <div class="playlist-head">
        <h2>My Playlist</h2>
        <span>▶</span>
      </div>

      <div class="youtube-wrap">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLlBTRvaC0XtKnzRLR5m7dc1S58gk_nZJ_"
          title="YouTube playlist"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

    </section>

    <footer>
      <span>Made as a personal playlist page</span>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
