<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samajwadi Party 2027</title>
  <link rel="stylesheet" href="style.css">
</head>

<body<body style="background: linear-gradient(135deg, #ff8a00 0%, #ffffff 50%, #008000 100%);">

<main class="phone">

  <div class="topbar">
    <span>MISSION 2027</span>
    <span class="dot"></span>
    <span>PDA 🚲</span>
  </div>

  <section class="hero">

    <div class="flag-glow"></div>

    <div class="hero-content">

      <div class="small-title">MISSION 2027</div>

      <h1>
        समाजवादी पार्टी<br>
        <span>🚲 2027</span>
      </h1>

      <div class="moving-cycle">
        🚲
      </div>

      <h2 class="vote-line">
        2027 — आपका वोट, आपका फैसला
      </h2>

      <div class="work-slider">
        <p id="workText">
          1090 महिला शक्ति लाइन — महिलाओं की सुरक्षा से जुड़ी हेल्पलाइन
        </p>
      </div>

    </div>

  </section>

  <section class="playlist">

    <div class="playlist-head">

      <div>
        <h2>🎵 Mission 2027 Playlist</h2>
        <p>गाने सुनें और playlist का आनंद लें</p>
      </div>

      <span>▶</span>

    </div>

    <div class="youtube-wrap">

      <iframe
        src="https://www.youtube.com/embed/videoseries?list=PLlBTRvaC0XtKnzRLR5m7dc1S58gk_nZJ_"
        title="Mission 2027 Playlist"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>

  </section>

  <footer>
    <span>Made as a personal playlist page</span>
  </footer>

</main>

<script src="script.js"></script>

</body>
</html>
