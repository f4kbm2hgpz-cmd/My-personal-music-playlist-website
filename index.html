<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDA Mission 2027</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070707;
      color: white;
      min-height: 100vh;
    }

    /* TOP BAR */

    .topbar {
      height: 70px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8,8,8,.88);
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
    }

    .mission {
      font-size: 12px;
      letter-spacing: 2px;
      color: #aaa;
      font-weight: bold;
    }

    /* HERO */

    .hero {
      min-height: 510px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 70px 20px;

      background:
        radial-gradient(circle at 15% 20%, rgba(255,0,0,.22), transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(0,255,100,.14), transparent 35%),
        #070707;
    }

    .hero-content {
      max-width: 850px;
    }

    .label {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 50px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 82px);
      line-height: 1.05;
      font-weight: 900;
    }

    h1 span {
      display: block;
      margin-top: 10px;
    }

    .subtitle {
      margin-top: 22px;
      color: #999;
      font-size: 17px;
    }

    .cycle {
      font-size: 70px;
      margin: 25px 0;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .info-box {
      display: inline-block;
      max-width: 650px;
      padding: 16px 22px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      color: #ddd;
    }

    #workText {
      transition: opacity .4s;
    }

    /* MUSIC */

    .music {
      width: min(650px, 92%);
      margin: 40px auto 90px;
    }

    .music-heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .music-heading h2 {
      font-size: 30px;
    }

    .music-heading p {
      margin-top: 8px;
      color: #777;
    }

    /* PLAYER */

    .player {
      padding: 30px;
      border-radius: 30px;
      background:
        linear-gradient(145deg,#191919,#0c0c0c);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow:
        0 30px 80px rgba(0,0,0,.55);
    }

    .cover {
      width: 190px;
      height: 190px;
      margin: 0 auto 25px;

      display: grid;
      place-items: center;

      border-radius: 28px;

      font-size: 80px;

      background:
        radial-gradient(circle at 30% 25%,#333,transparent 40%),
        linear-gradient(135deg,#202020,#080808);

      border: 1px solid rgba(255,255,255,.12);

      box-shadow:
        0 20px 60px rgba(0,0,0,.5);
    }

    .song-title {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
    }

    .song-number {
      text-align: center;
      margin-top: 7px;
      color: #777;
      font-size: 13px;
    }

    audio {
      width: 100%;
      margin: 25px 0;
    }

    /* BUTTONS */

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .control {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      cursor: pointer;

      background: #222;
      color: white;

      font-size: 20px;

      border: 1px solid rgba(255,255,255,.1);
    }

    .control:hover {
      background: #333;
    }

    .play-button {
      width: 70px;
      height: 70px;
      border: none;
      border-radius: 50%;

      background: white;
      color: black;

      font-size: 25px;
      cursor: pointer;

      box-shadow: 0 10px 35px rgba(255,255,255,.12);
    }

    .counter {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 12px;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #777;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    footer small {
      display: block;
      margin-top: 8px;
      color: #555;
    }

    /* MOBILE */

    @media(max-width:600px) {

      .topbar {
        padding: 0 20px;
      }

      .hero {
        min-height: 470px;
        padding: 55px 18px;
      }

      .music {
        width: 94%;
      }

      .player {
        padding: 22px 17px;
        border-radius: 24px;
      }

      .cover {
        width: 160px;
        height: 160px;
        font-size: 65px;
      }

      .song-title {
        font-size: 20px;
      }
    }
  </style>
</head>


<body>

<header class="topbar">

  <div class="brand">
    PDA 🚲
  </div>

  <div class="mission">
    MISSION 2027
  </div>

</header>


<main>


<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <div class="label">
      PDA • MISSION 2027
    </div>

    <h1>
      समाजवादी पार्टी
      <span>🚲 2027</span>
    </h1>

    <p class="subtitle">
      अपनी playlist • अपना music • अपना page
    </p>

    <div class="cycle">
      🚲
    </div>

    <div class="info-box">

      <p id="workText">
        1090 महिला शक्ति लाइन — महिलाओं की सुरक्षा से जुड़ी हेल्पलाइन
      </p>

    </div>

  </div>

</section>


<!-- MUSIC PLAYER -->

<section class="music">

  <div class="music-heading">

    <h2>🎵 Mission 2027 Music</h2>

    <p>
      अपनी पसंद का गाना सुनें
    </p>

  </div>


  <div class="player">

    <div class="cover">
      🎵
    </div>


    <div
      class="song-title"
      id="songTitle">
      PDA Song 01
    </div>


    <div
      class="song-number"
      id="songNumber">
      Song 1
    </div>


    <audio
      id="audioPlayer"
      controls>
    </audio>


    <div class="controls">

      <button
        class="control"
        onclick="previousSong()">
        ⏮
      </button>


      <button
        class="play-button"
        id="playButton"
        onclick="togglePlay()">
        ▶
      </button>


      <button
        class="control"
        onclick="nextSong()">
        ⏭
      </button>

    </div>


    <div
      class="counter"
      id="counter">
      1 / 20
    </div>

  </div>

</section>


</main>


<footer>

  PDA • Mission 2027

  <small>
    Created by Pranjul Yadav
  </small>

</footer>


<script>

/* =========================
   MP3 SONG LIST
   ========================= */

const songs = [

  "song1.mp3",
  "song2.mp3",
  "song3.mp3",
  "song4.mp3",
  "song5.mp3",
  "song6.mp3",
  "song7.mp3",
  "song8.mp3",
  "song9.mp3",
  "song10.mp3",
  "song11.mp3",
  "song12.mp3",
  "song13.mp3",
  "song14.mp3",
  "song15.mp3",
  "song16.mp3",
  "song17.mp3",
  "song18.mp3",
  "song19.mp3",
  "song20.mp3"

];


let currentSong = 0;


const audio =
  document.getElementById("audioPlayer");

const title =
  document.getElementById("songTitle");

const number =
  document.getElementById("songNumber");

const counter =
  document.getElementById("counter");

const playButton =
  document.getElementById("playButton");


/* LOAD SONG */

function loadSong(index, autoPlay = false) {

  currentSong = index;

  audio.src =
    "mp3/" + songs[currentSong];

  title.textContent =
    songs[currentSong]
      .replace(".mp3","")
      .replace(/[_-]/g," ");

  number.textContent =
    "Song " + (currentSong + 1);

  counter.textContent =
    (currentSong + 1) +
    " / " +
    songs.length;

  if(autoPlay) {

    audio.play();

    playButton.textContent = "❚❚";

  } else {

    playButton.textContent = "▶";

  }

}


/* PLAY / PAUSE */

function togglePlay() {

  if(audio.paused) {

    audio.play();

    playButton.textContent = "❚❚";

  } else {

    audio.pause();

    playButton.textContent = "▶";

  }

}


/* NEXT */

function nextSong() {

  currentSong++;

  if(currentSong >= songs.length) {
    currentSong = 0;
  }

  loadSong(currentSong, true);

}


/* PREVIOUS */

function previousSong() {

  currentSong--;

  if(currentSong < 0) {
    currentSong = songs.length - 1;
  }

  loadSong(currentSong, true);

}


/* AUTOMATIC NEXT */

audio.addEventListener("ended", function() {

  nextSong();

});


/* UPDATE BUTTON */

audio.addEventListener("play", function() {

  playButton.textContent = "❚❚";

});


audio.addEventListener("pause", function() {

  playButton.textContent = "▶";

});


/* FIRST SONG */

loadSong(0);


/* =========================
   HERO TEXT
   ========================= */

const works = [

  "1090 महिला शक्ति लाइन — महिलाओं की सुरक्षा से जुड़ी हेल्पलाइन",

  "लखनऊ मेट्रो — शहरी परिवहन परियोजना",

  "आगरा-लखनऊ एक्सप्रेसवे — 302 किलोमीटर का एक्सप्रेसवे",

  "किसान बाज़ार — किसानों से जुड़ी बाजार व्यवस्था",

  "लोहिया आवास योजना — ग्रामीण आवास से जुड़ी योजना",

  "108 आपातकालीन एम्बुलेंस सेवा — स्वास्थ्य सेवा"

];


let currentWork = 0;


setInterval(() => {

  const text =
    document.getElementById("workText");

  text.style.opacity = "0";


  setTimeout(() => {

    currentWork =
      (currentWork + 1) %
      works.length;

    text.textContent =
      works[currentWork];

    text.style.opacity = "1";

  },400);


},3500);

</script>

</body>
</html>
